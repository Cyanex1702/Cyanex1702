<text x="32" y="112" class="label">EVENT</text><text x="245" y="112" class="value">PUSH</text>
<text x="32" y="142" class="label">BRANCH</text><text x="245" y="142" class="value">MAIN</text>
<text x="32" y="172" class="label">COMMITS</text><text x="245" y="172" class="value">0</text>
<text x="500" y="82" class="label">AGE</text><text x="725" y="82" class="value">11H 04M</text>
