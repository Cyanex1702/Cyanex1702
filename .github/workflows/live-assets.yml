name: Refresh Live Terminal Assets

on:
  workflow_dispatch:
  schedule:
    - cron: "11 */6 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/generate_live_assets.py"
      - ".github/workflows/live-assets.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5

      - name: Generate live terminal panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_live_assets.py

      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal-telemetry.svg assets/neofetch.svg assets/last-packet.svg assets/matrix-contributions.svg
          if git diff --cached --quiet; then
            echo "Live assets are already current."
          else
            git commit -m "chore: refresh live terminal telemetry"
            git push
          fi
