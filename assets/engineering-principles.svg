<path d="M28 21 L1052 21" stroke="#68F1AE" stroke-width="2" fill="none" opacity="0.6"/><text x="40" y="65" fill="#68F1AE" font-size="16" font-weight="750" font-family="DejaVu Sans Mono, Courier New, monospace" letter-spacing="2">03   /   HOW I WORK</text><text x="40" y="115" fill="#E6FFF4" font-size="37" font-weight="800" font-family="Arial, Helvetica, sans-serif">ENGINEERING IS A PRACTICE.</text><text x="41" y="143" fill="#97BFB6" font-size="17" font-weight="500" font-family="Arial, Helvetica, sans-serif">What matters to me when technology leaves the screen.</text><rect x="37" y="169" width="324" height="153" rx="10" fill="#0A2021" stroke="#315D55" stroke-width="1" opacity="1"/><rect x="37" y="169" width="324" height="3" rx="0" fill="#68F1AE" stroke="none" stroke-width="1" opacity="0.8"/><text x="57" y="206" fill="#68F1AE" font-size="25" font-weight="750" font-family="DejaVu Sans Mono, Courier New, monospace">01</text><text x="57" y="241" fill="#E6FFF4" font-size="18" font-weight="750" font-family="DejaVu Sans Mono, Courier New, monospace">THINK IN SYSTEMS</text><text x="57" y="272" fill="#97BFB6" font-size="15" font-weight="500" font-family="Arial, Helvetica, sans-serif">The model is a component.</text><text x="57" y="295" fill="#97BFB6" font-size="15" font-weight="500" font-family="Arial, Helvetica, sans-serif">Architecture is the craft.</text><rect x="384" y="169" width="324" height="153" rx="10" fill="#0A2021" stroke="#315D55" stroke-width="1" opacity="1"/><rect x="384" y="169" width="324" height="3" rx="0" fill="#71E0DC" stroke="none" stroke-width="1" opacity="0.8"/><text x="404" y="206" fill="#71E0DC" font-size="25" font-weight="750" font-family="DejaVu Sans Mono, Courier New, monospace">02</text><text x="404" y="241" fill="#E6FFF4" font-size="18" font-weight="750" font-family="DejaVu Sans Mono, Courier New, monospace">DESIGN FOR REAL USE</text><text x="404" y="272" fill="#97BFB6" font-size="15" font-weight="500" font-family="Arial, Helvetica, sans-serif">Make complexity usable.</text><text x="404" y="295" fill="#97BFB6" font-size="15" font-weight="500" font-family="Arial, Helvetica, sans-serif">Respect the machine and user.</text><rect x="731" y="169" width="324" height="153" rx="10" fill="#0A2021" stroke="#315D55" stroke-width="1" opacity="1"/><rect x="731" y="169" width="324" height="3" rx="0" fill="#F6CA87" stroke="none" stroke-width="1" opacity="0.8"/><text x="751" y="206" fill="#F6CA87" font-size="25" font-weight="750" font-family="DejaVu Sans Mono, Courier New, monospace">03</text><text x="751" y="241" fill="#E6FFF4" font-size="18" font-weight="750" font-family="DejaVu Sans Mono, Courier New, monospace">BUILD BEYOND THE DEMO</text><text x="751" y="272" fill="#97BFB6" font-size="15" font-weight="500" font-family="Arial, Helvetica, sans-serif">Test the edges.</text><text x="751" y="295" fill="#97BFB6" font-size="15" font-weight="500" font-family="Arial, Helvetica, sans-serif">Keep improving. Then ship.</text></svg>